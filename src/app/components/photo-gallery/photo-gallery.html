<div class="container mx-auto py-8 px-4">
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <!-- Header Section -->
        <div class="p-6">
            <h1 class="text-2xl font-bold text-gray-900 mb-6">Photos</h1>
            
            <!-- Navigation Tabs -->
            <div class="flex gap-8 border-b border-gray-100 overflow-x-auto pb-px no-scrollbar">
                @for (tab of tabs; track tab.id) {
                    <button 
                        (click)="setActiveTab(tab.id)"
                        class="pb-4 text-sm font-semibold transition-all duration-200 relative whitespace-nowrap"
                        [class.text-blue-600]="activeTab === tab.id"
                        [class.text-gray-500]="activeTab !== tab.id"
                        [class.hover:text-gray-700]="activeTab !== tab.id"
                    >
                        {{ tab.label }}
                        @if (activeTab === tab.id) {
                            <div class="absolute bottom-0 left-0 right-0 h-[3px] bg-blue-600 rounded-t-full"></div>
                        }
                    </button>
                }
            </div>
        </div>

        <!-- Photo Grid Content -->
        <div class="p-6 bg-white">
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                @for (photo of photos; track $index) {
                    <div class="aspect-square relative group overflow-hidden rounded-lg bg-gray-100 shadow-sm hover:shadow-md transition-all duration-300 border border-gray-200">
                        <img 
                            [src]="photo.url" 
                            [alt]="photo.alt"
                            class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
                        />
                        <div class="absolute inset-0 bg-black/0 group-hover:bg-black/5 transition-colors duration-300"></div>
                    </div>
                }
            </div>
        </div>
    </div>
</div>
