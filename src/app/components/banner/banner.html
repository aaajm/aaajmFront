<div class="bg-gray-100 py-2 px-0 flex justify-center items-center w-full">
  <div class="relative w-[99.5%] bg-black rounded-md p-1.5 shadow-lg overflow-hidden border-[2px] border-[#D4AF37]">
    
    <!-- Decorative corners / Screws -->
    <div class="absolute top-1.5 left-1.5 w-4 h-4 rounded-full bg-gradient-to-br from-[#FFD700] via-[#D4AF37] to-[#8B4513] shadow-sm flex items-center justify-center z-10">
      <div class="w-2.5 h-[1px] bg-[#5C3317] rotate-45 opacity-60"></div>
    </div>
    <div class="absolute top-1.5 right-1.5 w-4 h-4 rounded-full bg-gradient-to-br from-[#FFD700] via-[#D4AF37] to-[#8B4513] shadow-sm flex items-center justify-center z-10">
      <div class="w-2.5 h-[1px] bg-[#5C3317] -rotate-45 opacity-60"></div>
    </div>
    <div class="absolute bottom-1.5 left-1.5 w-4 h-4 rounded-full bg-gradient-to-br from-[#FFD700] via-[#D4AF37] to-[#8B4513] shadow-sm flex items-center justify-center z-10">
      <div class="w-2.5 h-[1px] bg-[#5C3317] -rotate-45 opacity-60"></div>
    </div>
    <div class="absolute bottom-1.5 right-1.5 w-4 h-4 rounded-full bg-gradient-to-br from-[#FFD700] via-[#D4AF37] to-[#8B4513] shadow-sm flex items-center justify-center z-10">
      <div class="w-2.5 h-[1px] bg-[#5C3317] rotate-45 opacity-60"></div>
    </div>

    <!-- Inner frame -->
    <div class="border-[1px] border-[#D4AF37] rounded-sm p-3 flex flex-col items-center text-center relative overflow-hidden">
      
      <!-- Subtle gold radial gradient background -->
      <div class="absolute inset-0 opacity-10 pointer-events-none bg-[radial-gradient(circle_at_center,_#D4AF37_0%,_transparent_70%)]"></div>

      <!-- Top Emblem -->
      <div class="relative mb-3 group flex-shrink-0">
        <div class="absolute -inset-2 bg-[#D4AF37] rounded-full blur opacity-15 group-hover:opacity-25 transition duration-1000"></div>
        <div class="relative w-32 h-32 aspect-square flex-shrink-0 rounded-full bg-red-700 flex items-center justify-center shadow-xl">
          <span class="text-white font-serif font-bold text-xl tracking-widest drop-shadow-lg">A.A.A.J.M</span>
        </div>
      </div>

      <!-- Main Text Content -->
      <div class="space-y-1.5 font-serif z-10 max-w-5xl">
        <h2 class="text-[#FFD700] text-lg md:text-xl font-bold uppercase tracking-wider leading-tight">
          Association des Anciens et Amis du Japon à Madagascar
        </h2>
        
        <h3 class="text-[#FFD700] text-base md:text-lg font-semibold italic">
          Maintimolalin'i Japana
        </h3>
        
        <div class="py-0.5">
          <p class="text-[#FFD700] text-2xl md:text-3xl font-bold tracking-[0.1em] opacity-90">
            対日経験者同窓会
          </p>
        </div>

        <div class="relative inline-block py-0.5">
          <div class="absolute inset-x-0 bottom-0 h-px bg-gradient-to-r from-transparent via-[#FFD700] to-transparent"></div>
          <p class="text-[#FFD700] text-xl md:text-2xl font-black italic tracking-tighter">
            30<sup class="text-xs">ème</sup> ANNIVERSAIRE
          </p>
          <div class="absolute inset-x-0 top-0 h-px bg-gradient-to-r from-transparent via-[#FFD700] to-transparent"></div>
        </div>

        <div class="text-[#FFD700] text-base md:text-lg font-bold uppercase tracking-[0.05em] leading-relaxed">
          <p>RASSEMBLEUR ET PILIER DU DEVELOPPEMENT DE MADAGASCAR</p>
        </div>
      </div>

      <!-- Flags Section -->
      <div class="flex flex-row justify-between items-center w-full pt-4 px-4 sm:px-10 z-10">
        <!-- Madagascar Flag -->
        <div class="w-24 h-14 border border-[#D4AF37] flex shadow-md shadow-black/50">
          <div class="w-1/3 bg-white"></div>
          <div class="w-2/3 flex flex-col">
            <div class="h-1/2 bg-[#D30612]"></div>
            <div class="h-1/2 bg-[#007E3A]"></div>
          </div>
        </div>

        <!-- Japan Flag -->
        <div class="w-24 h-14 border border-[#D4AF37] bg-white flex items-center justify-center shadow-md shadow-black/50 relative overflow-hidden">
          <div class="w-8 h-8 rounded-full bg-[#BC002D] shadow-inner"></div>
        </div>
      </div>

    </div>
  </div>
</div>
