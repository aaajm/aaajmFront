<div
  class="flex w-full font-sans"
  [class.h-screen]="contentLock()"
  [class.min-h-screen]="!contentLock()"
  [class.overflow-hidden]="contentLock()"
>
  <sidebar></sidebar>
  <main
    class="flex-1 flex flex-col min-w-0 w-full"
    [class.h-full]="contentLock()"
    [class.min-h-0]="contentLock()"
  >
    <app-navbar class="shrink-0"></app-navbar>
    @if (contentLock()) {
      <div class="flex-1 min-h-0 overflow-hidden">
        <router-outlet></router-outlet>
      </div>
    } @else {
      <div class="flex-1 w-full">
        <router-outlet></router-outlet>
      </div>
      <app-footer class="shrink-0"></app-footer>
    }
  </main>
</div>
