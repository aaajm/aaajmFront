<div
  class="w-24 h-24 flex justify-center font-bold text-2xl rounded-full bg-[#D03830] text-white border-none mb-10 items-center mx-auto"
>
  AAAJM
</div>

<nav class="flex-1 space-y-2 text-gray-800">
  @for (route of possibleRoutes(); track $index) { @if(route.authorized){
  <a
    [href]="route.url"
    class="flex items-center gap-3 p-3  text-sm uppercase tracking-widest font-bold rounded-xl {{currentUrl().startsWith(route.url) ? 'bg-blue-600/10':'' }}"
  >
    {{route.label}}
  </a>
  } }
</nav>

@if (authProvider.isLoggedIn()) {
<div
  class="flex items-center gap-3 p-2 mt-auto cursor-pointer"
  (click)="navigate('/profile')"
>
  <p-avatar
    [image]="authProvider.currentUser()?.profile"
    class="border-2"
    shape="circle"
  ></p-avatar>
  <div class="text-sm">
    <p class="font-bold">{{loggedUser()?.firstname}}</p>
    <p class="text-gray-500 text-xs">role</p>
  </div>
</div>
<p-button
  icon="pi pi-sign-out"
  label="Deconnexion"
  class="w-full"
  size="small"
  variant="outlined"
  (click)="authProvider.logout()"
></p-button>
}
