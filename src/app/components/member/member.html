<div
  class="bg-white p-4 rounded-xl border border-gray-100 flex-col flex w-full max-w-52 md:max-w-xs"
>
  <div class="relative w-full max-w-xl min-w-36 isolate aspect-[8/5]">
    <p-image
      [src]="member?.profile"
      imageClass="object-cover rounded-xl  w-full"
      [alt]="member?.firstname"
    />
  </div>
  <div class="flex flex-col gap-1">
    <h4 class="font-bold text-teal-950 text-xl">
      {{member?.firstname || ""}} {{member?.lastname || ""}}
    </h4>
    <span class="font-bold text-orange-700 text-xs"
      >{{member?.postOffice}}</span
    >
    <div class="flex flex-col gap-1 mt-2 border-t text-gray-400">
      <div class="flex items-center gap-2 mt-2 text-gray-600 text-xs">
        <i class="pi pi-envelope"></i>
        <span>{{member?.email}}</span>
      </div>
      <div class="flex items-center gap-2 mt-2 text-gray-600 text-xs">
        <i class="pi pi-phone"></i>
        <span>{{member?.phone}}</span>
      </div>
    </div>
  </div>
</div>
