<section class="flex items-center p-10" id="mission-history">
  <div
    class="container mx-auto flex flex-col-reverse lg:flex-row justify-between gap-10"
  >
    <div>
      <div>
        <h2
          class="text-4xl font-bold font-serif text-[#D03830] mb-6 tracking-tight"
        >
          Notre mission
        </h2>
        <ul class="leading-10">
          @for (item of missions; track $index) {
          <li class="ml-5 text-[#4B5563] text-lg max-w-xl mb-10 list-disc">
            {{item}}
          </li>
          }
        </ul>
      </div>

      <div class="flex gap-6">
        <div
          class="bg-white p-6 rounded-lg shadow-sm border border-gray-100 flex-1"
        >
          <div class="text-3xl font-bold text-orange-700">@if(userResource.isLoading()) { ... } @else { {{ memberCount() }} }</div>
          <div
            class="text-[10px] uppercase tracking-widest text-gray-400 mt-1 font-sans font-bold"
          >
            Membres actifs
          </div>
        </div>
        <div
          class="bg-white p-6 rounded-lg shadow-sm border border-gray-100 flex-1"
        >
          <div class="text-3xl font-bold text-orange-700">50+</div>
          <div
            class="text-[10px] uppercase tracking-widest text-gray-400 mt-1 font-sans font-bold"
          >
            Projets réalisés
          </div>
        </div>
      </div>
    </div>

    <div class="w-full lg:w-1/3">
      <h2
        class="text-4xl font-bold font-serif text-[#D03830] mb-8 tracking-tight"
      >
        Histoire
      </h2>
      <div class="flex flex-col gap-8">
        @for (item of legacyItems; track $index) {
        <div class="flex gap-6">
          <span class="text-orange-700 text-xl font-bold pt-1"
            >{{item.year}}</span
          >
          <div class="flex flex-col">
            <h4 class="font-bold text-2xl">{{item.title}}</h4>
            <p class="text-[#4B5563] text-lg max-w-xl mb-10 leading-relaxed">
              {{item.desc}}
            </p>
          </div>
        </div>
        }
      </div>
    </div>
  </div>
</section>
