<div
  class="flex {{screen.isMobile() ? '' : 'items-center'}} justify-center h-full"
>
  <div class="w-full max-w-xl">
    <div
      class="bg-white p-5 rounded-2xl flex flex-col h-full justify-center items-center shadow-xl border-2 border-slate-50"
    >
      <h3 class="text-3xl font-bold text-teal-950 mb-8">
        Vérification d'email
      </h3>
      <form
        class="flex flex-col gap-6 w-full"
        [formGroup]="form"
        (ngSubmit)="submit()"
      >
        <div class="flex flex-col gap-2 mb-5">
          <label for="password_input">OTP Code</label>
          <p-input-otp
            styleClass="w-full border-2"
            formControlName="code"
            [length]="5"
          />
          <small id="code-helper" class="text-red-400"
            >{{ zodErrors()['code'] }}</small
          >
        </div>
        <p-button
          type="submit"
          [loading]="mfaState.isLoading()"
          [raised]="true"
          label="Envoyer"
          styleClass="w-full text-white font-bold py-2 rounded-lg bg-[#D03830]"
        />
      </form>
    </div>
  </div>
</div>
