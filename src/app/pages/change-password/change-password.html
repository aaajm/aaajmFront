<div
  class="flex {{screen.isMobile() ? '' : 'items-center'}} justify-center h-full"
>
  <div class="w-full max-w-xl">
    <div
      class="bg-white p-5 rounded-2xl flex flex-col h-full justify-center items-center shadow-xl border-2 border-slate-50"
    >
      <h3 class="text-3xl font-bold text-teal-950 mb-8">
        Changé votre mot de passe
      </h3>
      <form
        class="flex flex-col gap-6 w-full"
        [formGroup]="form"
        (ngSubmit)="submit()"
      >
        <p-inputgroup class="flex flex-col gap-2">
          <label class="font-bold text-gray-600">Nouveau mot de passe</label>
          <input
            formControlName="newPassword"
            pInputText
            [invalid]="zodErrors()['newPassword']"
            placeholder="*****"
            class="w-full p-2 bg-slate-100 border-none rounded-lg outline-none"
          />
          <small class="text-red-400 font-bold"
            >{{ zodErrors()['newPassword'] }}</small
          >
        </p-inputgroup>
        <p-inputgroup class="flex flex-col gap-2">
          <label class="font-bold text-gray-600"
            >Confirmé votre mot de passe</label
          >
          <input
            formControlName="confirmPassword"
            pInputText
            [invalid]="zodErrors()['confirmPassword']"
            placeholder="******"
            class="w-full p-2 bg-slate-100 border-none rounded-lg outline-none"
          />
          <small class="text-red-400 font-bold"
            >{{ zodErrors()['confirmation'] }}</small
          >
        </p-inputgroup>
        <div class="flex flex-col gap-2 mb-5">
          <label for="password_input">OTP Code</label>
          <p-input-otp
            styleClass="w-full border-2"
            formControlName="otpCode"
            [length]="5"
          />
          <small id="code-helper" class="text-red-400"
            >{{ zodErrors()['otpCode'] }}</small
          >
        </div>
        <p-button
          type="submit"
          [loading]="changeState.isLoading()"
          [raised]="true"
          label="Envoyer"
          styleClass="w-full text-white font-bold py-2 rounded-lg bg-[#D03830]"
        />
      </form>
    </div>
  </div>
</div>
