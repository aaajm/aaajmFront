<section class="p-10 h-full w-full">
  <div class="flex flex-col mb-12 gap-6">
    <div class="flex items-center gap-5 justify-between w-full">
      <h2 class="text-4xl font-bold text-[#D03830] tracking-tight">
        Gérer les actualités
      </h2>
      <p-button
        label="Ajouter"
        icon="pi pi-plus"
        class="p-2 rounded-2xl bg-black text-white"
        (click)="openDialog()"
      ></p-button>
    </div>
    <p-table
      [value]="topics()"
      [stripedRows]="true"
      size="small"
      [loading]="topicResource.isLoading()"
    >
      <ng-template #header>
        <tr>
          <th>Titre</th>
          <th>Auteur</th>
          <th>Date de création</th>
          <th>Actions</th>
        </tr>
      </ng-template>
      <ng-template #body let-topic>
        @let current = asTopic(topic);
        <tr>
          <td>{{topic.title}}</td>
          <td>
            {{current.createdBy.firstname}} {{current.createdBy.lastname}}
          </td>
          <td>{{formatDate(current.creationDatetime!) ||''}}</td>
          <td>
            <p-button
              icon="pi pi-pencil"
              pTooltip="Modifier"
              tooltipPosition="bottom"
              class="mr-2"
              [rounded]="true"
              [outlined]="true"
              (click)="openDialog(current)"
            />
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</section>
<p-dialog
  header="Créer et modifier des informations"
  [(visible)]="visibleDialog"
  (onHide)="closeDialog()"
  class="w-screen"
  [breakpoints]="{ '1199px': '75vw', '575px': '100vw' }"
>
  <topic-form [topicId]="selectedTopic()?.id || null"></topic-form>
</p-dialog>
